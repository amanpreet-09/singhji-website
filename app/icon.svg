<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Singhji Enterprises">
  <!-- Maroon seal -->
  <circle cx="100" cy="100" r="96" fill="#7A1B24"/>
  <!-- Stitch ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#F7F2EA" stroke-width="3"
          stroke-dasharray="9 7" stroke-linecap="round" opacity="0.9"/>
  <!-- Monogram -->
  <text x="100" y="134" text-anchor="middle" fill="#F7F2EA"
        font-family="Georgia, 'Times New Roman', 'Noto Serif', serif"
        font-size="104" font-style="italic">S</text>
  <!-- Needle through the ring -->
  <g transform="rotate(-38 100 100)">
    <line x1="100" y1="14" x2="100" y2="40" stroke="#F7F2EA" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="100" cy="12" rx="2.6" ry="5" fill="none" stroke="#F7F2EA" stroke-width="2"/>
  </g>
  <!-- Small accent dot -->
  <circle cx="100" cy="160" r="3.5" fill="#F7F2EA"/>
</svg>
