services:
  singhji-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: singhji-website
    env_file: .env.local
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
    volumes:
      - singhji_storage:/app/storage
    restart: always

volumes:
  singhji_storage: